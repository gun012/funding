<script>

async function loadData() {

  try {

    const res =
      await fetch('/api/dashboard?time=' + Date.now());

    const data =
      await res.json();

    console.log('dashboard data:', data);

    const list =
      data.customers ||
      data.recentCustomers ||
      data.data ||
      [];

    document.getElementById('total').innerText =
      data.total ||
      data.totalCustomers ||
      list.length ||
      0;

    document.getElementById('today').innerText =
      data.today ||
      data.todayCount ||
      0;

    document.getElementById('high').innerText =
      data.high ||
      data.highScoreCount ||
      0;

    document.getElementById('duplicate').innerText =
      data.duplicate ||
      0;

    const tbody =
      document.getElementById('tbody');

    tbody.innerHTML = '';

    if (!list.length) {

      tbody.innerHTML = `
        <tr>
          <td colspan="6"
            style="
              text-align:center;
              padding:40px;
              color:#666;
            ">
            고객 데이터가 없습니다.
          </td>
        </tr>
      `;

      return;
    }

    list.forEach(item => {

      const score =
        Number(item.score || 0);

      let status =
        '<span class="badge normal">일반</span>';

      if (item.isDuplicate) {

        status =
          '<span class="badge dup">중복</span>';

      } else if (score >= 70) {

        status =
          '<span class="badge hot">고확률</span>';
      }

      tbody.innerHTML += `
        <tr>

          <td>
            ${item.name || '-'}
          </td>

          <td>
            ${item.phone || '-'}
          </td>

          <td>
            ${item.business || item.q1 || '-'}
          </td>

          <td>
            <span class="badge ${score >= 70 ? 'high' : 'normal'}">
              ${score}점
            </span>
          </td>

          <td>
            ${status}
          </td>

          <td>
            ${formatDate(item.createdAt)}
          </td>

        </tr>
      `;
    });

  } catch (err) {

    console.error(err);

    alert(
      '대시보드 로딩 실패: ' + err.message
    );
  }
}

function formatDate(value) {

  if (!value) return '-';

  try {

    const date = new Date(value);

    return date.toLocaleString('ko-KR');

  } catch (e) {

    return value;
  }
}

loadData();

</script>
