<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>정책자금 관리자</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#f5f7fb;
      color:#111;
      padding:30px;
    }

    .login-wrap {
      min-height:90vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .login-box {
      width:100%;
      max-width:420px;
      background:white;
      border-radius:28px;
      padding:34px;
      box-shadow:0 18px 45px rgba(0,0,0,0.08);
    }

    .login-box h1 {
      font-size:30px;
      margin-bottom:10px;
    }

    .login-box p {
      color:#666;
      margin-bottom:24px;
      line-height:1.5;
    }

    .login-input {
      width:100%;
      padding:16px;
      border:1px solid #ddd;
      border-radius:16px;
      font-size:16px;
      margin-bottom:14px;
    }

    .login-btn {
      width:100%;
      background:#111827;
      color:white;
      border:none;
      padding:16px;
      border-radius:16px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .error {
      margin-top:14px;
      color:#dc2626;
      font-size:14px;
      display:none;
    }

    .wrap { max-width:1200px; margin:auto; display:none; }

    .top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    h1 { font-size:38px; margin-bottom:10px; }
    .sub { color:#666; }

    .top-buttons {
      display:flex;
      gap:10px;
    }

    .reload, .logout {
      border:none;
      padding:14px 22px;
      border-radius:16px;
      cursor:pointer;
      font-weight:bold;
      font-size:15px;
    }

    .reload {
      background:#111827;
      color:white;
    }

    .logout {
      background:#e5e7eb;
      color:#333;
    }

    .cards {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-bottom:24px;
    }

    .card {
      background:white;
      border-radius:24px;
      padding:24px;
      box-shadow:0 10px 30px rgba(0,0,0,0.06);
    }

    .card-title {
      color:#666;
      font-size:14px;
      margin-bottom:10px;
    }

    .card-value {
      font-size:34px;
      font-weight:800;
    }

    .panel {
      background:white;
      border-radius:24px;
      padding:24px;
      box-shadow:0 10px 30px rgba(0,0,0,0.06);
    }

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th {
      text-align:left;
      padding:14px;
      border-bottom:1px solid #eee;
      color:#666;
      font-size:13px;
    }

    td {
      padding:16px 14px;
      border-bottom:1px solid #f3f3f3;
      font-size:14px;
    }

    .badge {
      display:inline-block;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
    }

    .high { background:#111827; color:white; }
    .normal { background:#e5e7eb; color:#333; }
    .hot { background:#FEF3C7; color:#92400E; }
    .dup { background:#FEE2E2; color:#991B1B; }

    @media(max-width:900px){
      .cards { grid-template-columns:1fr 1fr; }
    }

    @media(max-width:600px){
      body { padding:18px; }
      .cards { grid-template-columns:1fr; }
      .top { flex-direction:column; align-items:flex-start; gap:20px; }
      .top-buttons { width:100%; }
      .reload, .logout { flex:1; }
      table { min-width:720px; }
      .panel { overflow-x:auto; }
    }
  </style>
</head>

<body>

  <div class="login-wrap" id="loginWrap">
    <div class="login-box">
      <h1>관리자 로그인</h1>
      <p>정책자금 CRM 고객정보 보호를 위해 비밀번호를 입력하세요.</p>

      <input
        type="password"
        id="passwordInput"
        class="login-input"
        placeholder="관리자 비밀번호"
        onkeydown="if(event.key === 'Enter') login()"
      />

      <button class="login-btn" onclick="login()">접속하기</button>

      <div class="error" id="loginError">
        비밀번호가 올바르지 않습니다.
      </div>
    </div>
  </div>

  <div class="wrap" id="dashboardWrap">

    <div class="top">
      <div>
        <h1>정책자금 CRM</h1>
        <div class="sub">최근 고객 · 고확률 고객 · 중복 신청 관리</div>
      </div>

      <div class="top-buttons">
        <button class="reload" onclick="loadData()">새로고침</button>
        <button class="logout" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-title">전체 신청</div>
        <div class="card-value" id="total">0</div>
      </div>

      <div class="card">
        <div class="card-title">오늘 신청</div>
        <div class="card-value" id="today">0</div>
      </div>

      <div class="card">
        <div class="card-title">70점 이상</div>
        <div class="card-value" id="high">0</div>
      </div>

      <div class="card">
        <div class="card-title">중복 고객</div>
        <div class="card-value" id="duplicate">0</div>
      </div>
    </div>

    <div class="panel">
      <h2>최근 고객 리스트</h2>

      <table>
        <thead>
          <tr>
            <th>이름</th>
            <th>전화번호</th>
            <th>업종</th>
            <th>점수</th>
            <th>상태</th>
            <th>신청일</th>
          </tr>
        </thead>

        <tbody id="tbody">
          <tr>
            <td colspan="6" style="text-align:center; padding:40px; color:#777;">
              불러오는 중...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    let adminPassword = localStorage.getItem('ADMIN_PASSWORD') || '';

    function showLogin() {
      document.getElementById('loginWrap').style.display = 'flex';
      document.getElementById('dashboardWrap').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('dashboardWrap').style.display = 'block';
    }

    async function login() {
      const input = document.getElementById('passwordInput');
      const error = document.getElementById('loginError');

      adminPassword = input.value.trim();

      if (!adminPassword) {
        error.innerText = '비밀번호를 입력하세요.';
        error.style.display = 'block';
        return;
      }

      localStorage.setItem('ADMIN_PASSWORD', adminPassword);

      const ok = await loadData();

      if (ok) {
        error.style.display = 'none';
        showDashboard();
      } else {
        localStorage.removeItem('ADMIN_PASSWORD');
        error.innerText = '비밀번호가 올바르지 않거나 데이터를 불러올 수 없습니다.';
        error.style.display = 'block';
      }
    }

    function logout() {
      localStorage.removeItem('ADMIN_PASSWORD');
      adminPassword = '';
      document.getElementById('passwordInput').value = '';
      showLogin();
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.innerText = value;
    }

    async function loadData() {
      try {
        const password =
          encodeURIComponent(adminPassword || localStorage.getItem('ADMIN_PASSWORD') || '');

        const res =
          await fetch('/api/dashboard?password=' + password + '&time=' + Date.now());

        const data =
          await res.json();

        if (!res.ok) {
          console.error('dashboard error:', data);
          return false;
        }

        const list =
          data.customers ||
          data.recentCustomers ||
          data.data ||
          [];

        setText('total', data.total || data.totalCustomers || list.length || 0);
        setText('today', data.today || data.todayCount || 0);
        setText('high', data.high || data.highScoreCount || 0);
        setText('duplicate', data.duplicate || 0);

        const tbody = document.getElementById('tbody');
        if (!tbody) return true;

        tbody.innerHTML = '';

        if (!list.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align:center; padding:40px; color:#777;">
                고객 데이터가 없습니다.
              </td>
            </tr>
          `;
          return true;
        }

        list.forEach(item => {
          const score = Number(item.score || 0);

          let status = '<span class="badge normal">일반</span>';

          if (item.isDuplicate) {
            status = '<span class="badge dup">중복</span>';
          } else if (score >= 70) {
            status = '<span class="badge hot">고확률</span>';
          }

          tbody.innerHTML += `
            <tr>
              <td>${item.name || '-'}</td>
              <td>${item.phone || '-'}</td>
              <td>${item.business || item.q1 || '-'}</td>
              <td>
                <span class="badge ${score >= 70 ? 'high' : 'normal'}">
                  ${score}점
                </span>
              </td>
              <td>${status}</td>
              <td>${formatDate(item.createdAt)}</td>
            </tr>
          `;
        });

        return true;

      } catch (err) {
        console.error(err);
        return false;
      }
    }

    function formatDate(value) {
      if (!value) return '-';

      try {
        const date = new Date(value);
        return date.toLocaleString('ko-KR');
      } catch (e) {
        return value;
      }
    }

    async function init() {
      if (adminPassword) {
        const ok = await loadData();

        if (ok) {
          showDashboard();
        } else {
          localStorage.removeItem('ADMIN_PASSWORD');
          showLogin();
        }
      } else {
        showLogin();
      }
    }

    init();
  </script>

</body>
</html>
